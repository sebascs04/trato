<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>PayPal sandbox · Trato</title><style>body{font:16px system-ui;background:#f7f6fb;color:#252237;max-width:32rem;margin:20vh auto;padding:2rem}</style></head><body><h1>PayPal sandbox · Trato</h1><p id="status">Vuelve a Trato para consultar el estado del pago.</p><script>(()=>{const query=new URLSearchParams(location.search);const order=query.get('token');const cancelled=query.get('result')==='cancel';history.replaceState(null,'',location.pathname);if(window.opener && order){window.opener.postMessage({type:'trato-paypal-test-return',order_id:order,cancelled},location.origin);document.getElementById('status').textContent=cancelled?'Regresa a Trato. No se confirmó ningún pago.':'Trato está verificando el resultado con PayPal. Este regreso por sí solo no confirma el pago.';}})();</script></body></html>
